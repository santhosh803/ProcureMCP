readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "celery>=5.6.3",
    "dj-database-url>=3.1.2",
    "django>=5.2.17",
    "django-cors-headers>=4.9.0",
    "django-filter>=26.1",
    "django-fsm>=3.0.1",
    "djangorestframework>=3.18.0",
    "drf-spectacular>=0.30.0",
    "faker>=40.36.0",
    "google-cloud-aiplatform>=1.165.0",
    "gunicorn>=26.1.0",
    "langchain-google-vertexai>=3.2.4",
    "mcp>=2.0.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.3",
    "redis>=8.1.0",
    "whitenoise>=6.12.0",
